<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 기기 - 플리마켓</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../common/css/style.css?v=7" />
    <link rel="stylesheet" href="../../common/css/toast.css?v=1" />
    <link rel="stylesheet" href="../../common/css/login-devices.css?v=2" />
    <script src="../../common/js/role-routing.js?v=5"></script>
    <link rel="stylesheet" href="../../common/css/global-nav.css?v=4" />
    <script src="../../common/js/global-nav.js?v=5" defer></script>
  </head>

  <body>
    <div class="page-wrap">
      <header class="nav">
        <a href="../../index.html" class="brand"><span class="pin-dot" aria-hidden="true"></span>플리마켓</a>
        <a href="mypage.html" class="link-ghost">마이페이지</a>
      </header>

      <div class="panel ld-wrap">
        <span class="pin" aria-hidden="true"></span>
        <h1>로그인 기기</h1>
        <p class="panel-sub">
          내 계정에 로그인되어 있는 기기예요. 모르는 기기가 있다면 비밀번호를 바꿔 주세요.
        </p>

        <div id="ld-banner" class="ld-banner" hidden></div>

        <ul class="ld-list" id="ld-list">
          <li class="ld-loading">불러오는 중이에요…</li>
        </ul>

        <div class="ld-info" id="ld-info"></div>

        <div class="ld-actions">
          <button type="button" class="btn btn-danger btn-sm" id="ld-kick-all" hidden>
            현재 기기만 남기고 모두 로그아웃
          </button>
          <a class="btn btn-mustard btn-sm" href="profile-edit.html">비밀번호 변경하기</a>
          <button type="button" class="btn btn-outline btn-sm" id="ld-refresh">새로고침</button>
        </div>

        <p class="ld-note">
          모르는 기기가 보이면 로그아웃한 뒤 <b>비밀번호도 함께 바꿔 주세요.</b>
          비밀번호를 그대로 두면 상대가 다시 로그인할 수 있어요.
          비밀번호를 바꾸면 다른 기기는 자동으로 모두 로그아웃됩니다.
        </p>
      </div>
    </div>

    <script src="../../common/js/api.js?v=4"></script>
    <script src="../../common/js/toast.js?v=1"></script>
    <script src="js/login-devices.js?v=2"></script>
  </body>
</html>
