<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>현장 체크인 - 플리마켓</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../common/css/style.css?v=7" />
    <link rel="stylesheet" href="../../common/css/toast.css?v=1" />
    <link rel="stylesheet" href="css/host-seller.css?v=2" />
    <link rel="stylesheet" href="../../common/css/checkin.css?v=5" />
    <script src="../../common/js/role-routing.js?v=5"></script>
    <link rel="stylesheet" href="../../common/css/global-nav.css?v=4" />
    <script src="../../common/js/global-nav.js?v=5" defer></script>
    <!-- [모바일 최적화] 반드시 <head> 맨 마지막에 둡니다 (기존 CSS 를 덮어써야 함) -->
  <link rel="stylesheet" href="../../common/css/mobile.css?v=3" />
  <script src="../../common/js/mobile-nav.js?v=3" defer></script>
</head>

  <body>
    <div class="page-wrap">
      <header class="nav">
        <a href="../../index.html" class="brand"><span class="pin-dot" aria-hidden="true"></span>플리마켓</a>
        <a href="mymarketpage.html" class="link-ghost">내 마켓 관리</a>
      </header>

      <div class="panel chk-wrap">
        <span class="pin" aria-hidden="true"></span>
        <h1>현장 체크인</h1>
        <p class="panel-sub" id="chk-market-title">마켓 정보를 불러오는 중이에요…</p>

        <!-- 날짜 탭 -->
        <div class="chk-day-tabs" id="chk-day-tabs"></div>

        <div id="chk-banner" class="chk-banner neutral">불러오는 중…</div>

        <!-- 체크인 시간 설정 (일괄 + 날짜별) -->
        <div class="chk-card" id="chk-schedule-card">
          <h2>체크인 시간 설정</h2>
          <p class="chk-muted">
            시작 시각의 <b id="chk-lead-label">1시간</b> 전부터 판매자 화면에 QR 이 자동으로 나오고,
            종료 시각이 지나면 멈춰요.
          </p>

          <!-- 일괄: 여기서 채우면 아래 모든 날짜 칸이 한 번에 바뀝니다 -->
          <div class="chk-bulk-row">
            <label class="chk-time-field">시작
              <input type="time" id="chk-start-time" value="10:00" />
            </label>
            <label class="chk-time-field">종료
              <input type="time" id="chk-end-time" value="17:00" />
            </label>
            <label class="chk-time-field">QR 사전 노출
              <select id="chk-lead">
                <option value="30">30분 전</option>
                <option value="60" selected>1시간 전</option>
                <option value="120">2시간 전</option>
                <option value="0">미리 안 띄움</option>
              </select>
            </label>
            <button type="button" class="btn btn-outline btn-sm" id="chk-apply-all">모든 날짜에 채우기</button>
          </div>

          <!-- 날짜별: 필요한 날만 따로 고칠 수 있습니다 -->
          <div id="chk-day-rows" class="chk-day-rows"></div>

          <div class="chk-actions">
            <button type="button" class="btn btn-mustard btn-sm" id="chk-schedule-save">저장</button>
            <span class="chk-muted" id="chk-dirty-hint"></span>
          </div>
          <div id="chk-schedule-result"></div>
        </div>

        <!-- 시작 / 종료 -->
        <div class="chk-card">
          <div class="chk-stat-row">
            <div class="chk-stat"><b id="chk-stat-in">-</b><span>출석</span></div>
            <div class="chk-stat"><b id="chk-stat-out">-</b><span id="chk-stat-out-label">미도착</span></div>
            <div class="chk-stat"><b id="chk-stat-total">-</b><span>참가 판매자</span></div>
          </div>
          <div class="chk-actions">
            <button type="button" class="btn btn-mustard btn-sm" id="chk-start">체크인 시작</button>
            <button type="button" class="btn btn-danger btn-sm" id="chk-close" hidden>체크인 종료</button>
          </div>
        </div>

        <!-- 스캐너 -->
        <div class="chk-card" id="chk-scan-card" hidden>
          <h2>QR 스캔</h2>
          <p class="chk-muted">판매자의 「입장 QR」 화면을 카메라에 비춰 주세요.</p>

          <div id="chk-scan-result" class="chk-scan-result"></div>

          <div class="chk-scanner" id="chk-scanner" hidden>
            <video id="chk-video" playsinline muted></video>
            <div class="chk-scanner-guide"></div>
          </div>
          <canvas id="chk-canvas" hidden></canvas>

          <div class="chk-actions">
            <button type="button" class="btn btn-mustard btn-sm" id="chk-cam-start">카메라 켜기</button>
            <button type="button" class="btn btn-outline btn-sm" id="chk-cam-stop" hidden>카메라 끄기</button>
          </div>

          <hr style="border:none;border-top:1px dashed #d9cdb8;margin:14px 0" />

          <h2>숫자 코드로 확인</h2>
          <p class="chk-muted">
            카메라를 못 쓸 때는 판매자 화면의 6자리 숫자를 입력하세요.
          </p>
          <div class="chk-actions">
            <input type="text" inputmode="numeric" maxlength="6" id="chk-code-input"
                   class="chk-code-input" placeholder="000000" />
            <button type="button" class="btn btn-mustard btn-sm" id="chk-code-submit">확인</button>
          </div>
        </div>

        <!-- 명단 -->
        <div class="chk-card">
          <h2>참가 명단</h2>
          <p class="chk-muted" id="chk-roster-hint">체크인을 시작하면 출석이 표시돼요.</p>
          <ul class="chk-list" id="chk-roster"></ul>
        </div>
      </div>
    </div>

    <script src="../../common/js/api.js?v=3"></script>
    <script src="../../common/js/toast.js?v=1"></script>
    <script src="../../common/js/vendor/jsqr.js"></script>
    <script src="js/checkin-scan.js?v=6"></script>
  </body>
</html>
