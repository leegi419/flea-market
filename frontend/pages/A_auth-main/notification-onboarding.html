<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>알림 설정 - 플리마켓</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../common/css/style.css?v=5" />
    <link rel="stylesheet" href="../../common/css/notification-settings.css?v=3" />
  </head>

  <body>
    <div class="page-wrap">
      <div class="panel ns-wrap">
        <span class="pin" aria-hidden="true"></span>

        <p class="ns-step" id="onb-step" hidden></p>
        <h1 id="onb-title">알림 설정</h1>
        <p class="panel-sub" id="onb-sub">받고 싶은 알림만 켜두세요. 나중에 마이페이지에서 바꿀 수 있어요.</p>

        <div id="ns-banner" class="ns-banner" hidden></div>

        <div id="ns-list" class="ns-list">
          <p class="ns-loading">불러오는 중이에요…</p>
        </div>

        <div class="ns-actions onb-actions">
          <button type="button" class="btn btn-ghost" id="onb-skip">나중에 하기</button>
          <button type="button" class="btn btn-mustard" id="onb-next">다음</button>
        </div>
        <p class="ns-hint" id="onb-hint">
          지금 넘어가도 모든 알림이 켜진 상태로 시작해요.
        </p>
      </div>
    </div>

    <script src="../../common/js/api.js?v=4"></script>
    <script src="js/notification-onboarding.js?v=2"></script>
  </body>
</html>
